[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-sim"
version = "0.1.0"
description = "CPU metadata execution and GPU memory/runtime projections for TorchTitan"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
titan-sim = "titan_sim.cli:main"

[tool.setuptools.packages.find]
include = ["titan_sim*"]

[tool.ruff]
line-length = 88
