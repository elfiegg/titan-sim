[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-sim"
version = "0.3.0"
description = "Workload-neutral simulation with explicit capture and calibration adapters"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
chakra = ["protobuf==7.36.2"]

[project.scripts]
titan-sim = "titan_sim.cli:main"

[tool.setuptools.packages.find]
include = ["titan_sim*"]

[tool.setuptools.package-data]
titan_sim = ["vendor/*.proto", "vendor/*.json", "vendor/*.md"]
