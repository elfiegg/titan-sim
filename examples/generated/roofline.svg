<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="770" viewBox="0 0 1050 770" role="img" aria-labelledby="title description">
<title id="title">Logical-traffic roofline: analytical ceilings and calibrated measurements</title>
<desc id="description">Logarithmic axes. Open circles show analytical ceilings, not achieved throughput. Filled diamonds show throughput derived only from calibrated durations. Logical traffic is not measured DRAM traffic.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" font-size="13" fill="#20242a">
<text x="105.00" y="35.00" font-size="24" font-weight="bold">Roofline using logical tensor traffic</text>
<text x="105.00" y="60.00" font-size="15">NVIDIA GB200 NVL72 Blackwell GPU (per GPU, dense peaks)</text>
<text x="105.00" y="83.00" font-size="14">Analytical markers are ceilings; measured throughput requires calibrated duration.</text>
<path d="M 105.00 115 V 525" stroke="#e1e5e9"/>
<text x="105.00" y="548.00" text-anchor="middle">10^1</text>
<path d="M 320.00 115 V 525" stroke="#e1e5e9"/>
<text x="320.00" y="548.00" text-anchor="middle">10^2</text>
<path d="M 535.00 115 V 525" stroke="#e1e5e9"/>
<text x="535.00" y="548.00" text-anchor="middle">10^3</text>
<path d="M 750.00 115 V 525" stroke="#e1e5e9"/>
<text x="750.00" y="548.00" text-anchor="middle">10^4</text>
<path d="M 965.00 115 V 525" stroke="#e1e5e9"/>
<text x="965.00" y="548.00" text-anchor="middle">10^5</text>
<path d="M 105 525.00 H 965" stroke="#e1e5e9"/>
<text x="93.00" y="529.00" text-anchor="end">10^0</text>
<path d="M 105 443.00 H 965" stroke="#e1e5e9"/>
<text x="93.00" y="447.00" text-anchor="end">10^1</text>
<path d="M 105 361.00 H 965" stroke="#e1e5e9"/>
<text x="93.00" y="365.00" text-anchor="end">10^2</text>
<path d="M 105 279.00 H 965" stroke="#e1e5e9"/>
<text x="93.00" y="283.00" text-anchor="end">10^3</text>
<path d="M 105 197.00 H 965" stroke="#e1e5e9"/>
<text x="93.00" y="201.00" text-anchor="end">10^4</text>
<path d="M 105 115.00 H 965" stroke="#e1e5e9"/>
<text x="93.00" y="119.00" text-anchor="end">10^5</text>
<path d="M 105 115 V 525 H 965" fill="none" stroke="#30363d"/>
<text x="535.00" y="580.00" text-anchor="middle" font-size="15">Arithmetic intensity (FLOP / logical byte)</text>
<text transform="translate(24 320.0) rotate(-90)" text-anchor="middle" font-size="15">Throughput (TFLOP/s)</text>
<path class="roofline-ceiling" data-dtype="bfloat16" d="M 105.00 368.95 L 426.39 246.37 L 965.00 246.37" fill="none" stroke="#0072B2" stroke-width="2"/>
<path d="M 105 603 h 25" stroke="#0072B2" stroke-width="2"/>
<text x="140.00" y="607.00">bfloat16: dense theoretical peak 2500 TFLOP/s</text>
<circle class="analytical-ceiling" data-event-id="gemm" cx="581.10" cy="246.37" r="4" fill="white" stroke="#0072B2"><title>gemm example_gemm; bfloat16; intensity=1638.4 FLOP/logical byte; analytical ceiling=2500 TFLOP/s (not achieved)</title></circle>
<text x="105.00" y="675.00" font-size="14">○ Analytical ceiling    ◆ Calibrated throughput (when available)</text>
<text x="105.00" y="698.00">GPU compute events: 1; plotted: 1; zero/unreported FLOPs: 0; zero traffic: 0; missing peak: 0.</text>
<text x="105.00" y="719.00">Capture reports 0 events across 0 operators without a FLOP formula.</text>
<text x="105.00" y="740.00">HBM roofline uses logical bytes, not observed DRAM traffic; collective and CPU events are excluded.</text>
</g></svg>